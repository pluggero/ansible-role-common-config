---
# Hostname
- name: Assert hostname has a valid format
  ansible.builtin.assert:
    that:
      - >-
        common_config_hostname == "" or
        common_config_hostname is ansible.builtin.regex("^[a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(\\.[a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*$")
    fail_msg: >-
      common_config_hostname '{{ common_config_hostname }}' is not a valid hostname/FQDN.
      Use RFC 1123 format (letters, digits, hyphens, dot-separated labels), or "" to leave
      the hostname unchanged.

# Locale
- name: Assert common_config_locale_extra is a list
  ansible.builtin.assert:
    that:
      - common_config_locale_extra is sequence
      - common_config_locale_extra is not string
    fail_msg: >-
      common_config_locale_extra must be a list of locale strings, got: {{ common_config_locale_extra }}

- name: Assert locale variables have a valid format
  ansible.builtin.assert:
    that:
      - >-
        item is ansible.builtin.regex("^(C|POSIX|[A-Za-z]{2,3}(_[A-Za-z]{2,4})?(\\.[A-Za-z0-9_-]+)?)$")
    fail_msg: >-
      Locale '{{ item }}' (from common_config_locale / common_config_locale_extra) is not a
      valid locale. Expected a format like "en_US.UTF-8", "de_DE.UTF-8", "C", or "POSIX".
  loop: "{{ [common_config_locale] + common_config_locale_extra }}"

# Keyboard
- name: Assert keyboard layout and variant have a valid format
  ansible.builtin.assert:
    that:
      - common_config_keyboard_layout is ansible.builtin.regex("^[A-Za-z0-9_-]+$")
      - >-
        common_config_keyboard_variant == "" or
        common_config_keyboard_variant is ansible.builtin.regex("^[A-Za-z0-9_-]+$")
    fail_msg: >-
      common_config_keyboard_layout ('{{ common_config_keyboard_layout }}') must be a
      non-empty keymap/layout code (letters, digits, hyphens, underscores) and
      common_config_keyboard_variant ('{{ common_config_keyboard_variant }}') must be
      empty or follow the same format.

- name: Assert common_config_keyboard_x11_conf is a boolean
  ansible.builtin.assert:
    that:
      - common_config_keyboard_x11_conf in [true, false]
    fail_msg: >-
      common_config_keyboard_x11_conf must be a boolean (true/false), got: {{ common_config_keyboard_x11_conf }}

# Timezone
- name: Assert timezone has a valid format
  ansible.builtin.assert:
    that:
      - common_config_timezone is ansible.builtin.regex("^[A-Za-z0-9_+-]+(/[A-Za-z0-9_+-]+){0,2}$")
    fail_msg: >-
      common_config_timezone '{{ common_config_timezone }}' is not a valid IANA timezone
      name. Expected a format like "UTC", "Europe/Berlin", or "America/Argentina/Buenos_Aires".

# Time sync (systemd-timesyncd)
- name: Assert common_config_ntp_servers and common_config_ntp_fallback_servers are lists
  ansible.builtin.assert:
    that:
      - common_config_ntp_servers is sequence
      - common_config_ntp_servers is not string
      - common_config_ntp_fallback_servers is sequence
      - common_config_ntp_fallback_servers is not string
    fail_msg: >-
      common_config_ntp_servers and common_config_ntp_fallback_servers must be lists of
      hostnames or IP addresses.

- name: Assert NTP server entries have a valid format
  ansible.builtin.assert:
    that:
      - >-
        item is ansible.builtin.regex("^[A-Za-z0-9.:-]+$")
    fail_msg: >-
      NTP server '{{ item }}' (from common_config_ntp_servers / common_config_ntp_fallback_servers)
      is not a valid hostname or IP address.
  loop: "{{ common_config_ntp_servers + common_config_ntp_fallback_servers }}"

# /etc/hosts
- name: Assert common_config_hosts_entries is a list
  ansible.builtin.assert:
    that:
      - common_config_hosts_entries is sequence
      - common_config_hosts_entries is not string
    fail_msg: >-
      common_config_hosts_entries must be a list of {ip, hostnames} dictionaries, got:
      {{ common_config_hosts_entries }}

- name: Assert each hosts entry has a valid ip and hostnames format
  ansible.builtin.assert:
    that:
      - item.ip is defined
      - item.ip is ansible.builtin.regex("^[A-Za-z0-9.:]+$")
      - item.hostnames is defined
      - item.hostnames is sequence
      - item.hostnames is not string
      - item.hostnames | length > 0
    fail_msg: >-
      common_config_hosts_entries entry {{ item }} must define a valid 'ip' (IPv4/IPv6
      address) and a non-empty 'hostnames' list.
  loop: "{{ common_config_hosts_entries }}"

- name: Assert common_config_manage_hosts is a boolean
  ansible.builtin.assert:
    that:
      - common_config_manage_hosts in [true, false]
    fail_msg: >-
      common_config_manage_hosts must be a boolean (true/false), got: {{ common_config_manage_hosts }}

# /etc/resolv.conf / systemd-resolved
- name: Assert DNS server variables are lists
  ansible.builtin.assert:
    that:
      - common_config_dns_servers is sequence
      - common_config_dns_servers is not string
      - common_config_dns_fallback_servers is sequence
      - common_config_dns_fallback_servers is not string
      - common_config_dns_search_domains is sequence
      - common_config_dns_search_domains is not string
    fail_msg: >-
      common_config_dns_servers, common_config_dns_fallback_servers, and
      common_config_dns_search_domains must all be lists.

- name: Assert DNS server entries have a valid format
  ansible.builtin.assert:
    that:
      - item is ansible.builtin.regex("^[A-Za-z0-9.:-]+$")
    fail_msg: >-
      DNS server '{{ item }}' (from common_config_dns_servers / common_config_dns_fallback_servers)
      is not a valid hostname or IP address.
  loop: "{{ common_config_dns_servers + common_config_dns_fallback_servers }}"

- name: Assert DNS search domains have a valid format
  ansible.builtin.assert:
    that:
      - item is ansible.builtin.regex("^[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?(\\.[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)+$")
    fail_msg: >-
      DNS search domain '{{ item }}' (from common_config_dns_search_domains) is not a
      valid domain name.
  loop: "{{ common_config_dns_search_domains }}"

- name: Assert common_config_manage_resolv_conf is a boolean
  ansible.builtin.assert:
    that:
      - common_config_manage_resolv_conf in [true, false]
    fail_msg: >-
      common_config_manage_resolv_conf must be a boolean (true/false), got:
      {{ common_config_manage_resolv_conf }}
