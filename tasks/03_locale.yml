---
- name: Include OS-specific locale tasks
  ansible.builtin.include_tasks: "{{ task_file }}"
  with_first_found:
    - "{{ role_path }}/tasks/noauto_locale_{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
    - "{{ role_path }}/tasks/noauto_locale_{{ ansible_os_family }}-{{ ansible_distribution_major_version }}.yml"
    - "{{ role_path }}/tasks/noauto_locale_{{ ansible_distribution }}.yml"
    - "{{ role_path }}/tasks/noauto_locale_{{ ansible_os_family }}.yml"
    - "{{ role_path }}/tasks/noauto_locale_{{ ansible_lsb.id }}.yml"
  loop_control:
    loop_var: task_file
