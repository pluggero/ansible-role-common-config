---
- name: Restart systemd-timesyncd
  ansible.builtin.systemd:
    name: systemd-timesyncd
    state: restarted
  become: true

- name: Restart systemd-resolved
  ansible.builtin.systemd:
    name: systemd-resolved
    state: restarted
  become: true
  when: "'systemd-resolved.service' in ansible_facts.services"

- name: Apply keyboard configuration (Debian)
  ansible.builtin.command: setupcon
  become: true
  changed_when: true

- name: Apply keyboard configuration (Archlinux)
  ansible.builtin.command: "loadkeys {{ common_config_keyboard_layout }}"
  become: true
  changed_when: true
  failed_when: false
